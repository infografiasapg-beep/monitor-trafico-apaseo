name: Monitor Trafico Apaseo

on:
  schedule:
    # Se ejecuta cada 15 minutos de forma automática
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras para probar

jobs:
  registrar_trafico:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests gspread oauth2client

      - name: Ejecutar recoleccion
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python monitor_trafico.py
